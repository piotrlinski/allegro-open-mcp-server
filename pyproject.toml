[project]
name = "allegro-mcp"
version = "0.1.0"
description = "MCP server for the Allegro REST API (allegro.pl) with a separable allegro_client SDK underneath."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Piotr Klinski", email = "piotrklinski@gmail.com" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "allegro",
    "allegro-pl",
    "marketplace",
    "e-commerce",
    "fastmcp",
    "oauth2",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.0",
]

[project.urls]
Homepage      = "https://github.com/piotrlinski/allegro-open-mcp-server"
Repository    = "https://github.com/piotrlinski/allegro-open-mcp-server"
Issues        = "https://github.com/piotrlinski/allegro-open-mcp-server/issues"
Documentation = "https://piotrlinski.github.io/allegro-open-mcp-server/"
Changelog     = "https://github.com/piotrlinski/allegro-open-mcp-server/blob/master/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "datamodel-code-generator>=0.26",
    "pyyaml>=6.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "griffe-pydantic>=1.1",
    "mkdocs-gen-files>=0.5",
    "mkdocs-literate-nav>=0.6",
    "mkdocs-section-index>=0.3",
    "mkdocs-include-markdown-plugin>=6.2",
    "mkdocs-redirects>=1.2",
    "mkdocs-static-i18n>=1.2",
    "mkdocs-git-revision-date-localized-plugin>=1.2",
    "mike>=2.1",
    "pymdown-extensions>=10.9",
    "codespell>=2.3",
]

[project.scripts]
allegro-mcp = "allegro_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Two top-level packages ship in the same wheel today. Future split into a
# standalone `allegro-client` distribution lifts only `src/allegro_client/`.
packages = ["src/allegro_client", "src/allegro_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "T20", "A", "RUF", "PERF", "PT"]
# Polish-language docstrings use en-dashes and other "ambiguous" Unicode
# deliberately; codegen output is exempt from style fights.
ignore = ["RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Codegen output: don't lint generated Pydantic models.
"src/allegro_client/models/_generated/*" = ["E501", "UP", "B", "SIM", "RUF", "PERF", "PT", "A", "F"]
# CLI scripts may legitimately print + emit long markdown lines.
"scripts/*" = ["T201", "T203", "E501"]
# Interactive OAuth flows print prompts to stderr by design (stdout is the
# MCP transport). The retry transport's try/except-in-loop is the natural
# shape of a retry policy and isn't a perf issue at the rates we operate at.
"src/allegro_client/auth/device.py" = ["T201", "PERF203"]
"src/allegro_client/auth/authcode.py" = ["T201"]
"src/allegro_client/http/retry.py" = ["PERF203"]
# Server bootstrap prints startup-failure messages to stderr — stdout is the
# MCP transport stream, so a logger or a print to stderr are the only sane
# options.
"src/allegro_mcp/server.py" = ["T201"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# datamodel-codegen output is validated at runtime by Pydantic; strict-mode
# checks here surface false positives caused by the generator emitting
# narrower subclass annotations than Pydantic's discriminated-union plumbing
# expects. We rely on Pydantic's own runtime validation.
module = "allegro_client.models._generated.*"
ignore_errors = true
