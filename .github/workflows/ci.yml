# Continuous integration: run lint + type-check + tests on every push and PR.
# Matrix on Python 3.10, 3.11, 3.12 because pyproject.toml declares
# requires-python >=3.10. uv handles the venv; pip cache lives in ~/.cache/uv.

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: latest
          enable-cache: true

      - name: Pin Python ${{ matrix.python-version }}
        run: uv python pin ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --extra dev --frozen

      - name: Lint (ruff)
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: Type-check (mypy --strict)
        run: uv run mypy src

      - name: Tests (pytest)
        run: uv run pytest tests/ -v

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          tags: allegro-mcp:ci
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
